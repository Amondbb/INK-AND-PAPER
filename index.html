<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>INK &amp; PAPER — 독서 기록장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-glow"></div>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 4.5C4 3.67 4.67 3 5.5 3H11V21H5.5C4.67 21 4 20.33 4 19.5V4.5Z" stroke="currentColor" stroke-width="1.6"/>
            <path d="M20 4.5C20 3.67 19.33 3 18.5 3H13V21H18.5C19.33 21 20 20.33 20 19.5V4.5Z" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </span>
        <h1>INK <span class="amp">&amp;</span> PAPER</h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="설정">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a7.97 7.97 0 000-2l2-1.5-2-3.4-2.4.7a8 8 0 00-1.7-1L14.8 3h-4l-.5 2.8a8 8 0 00-1.7 1l-2.4-.7-2 3.4L6.2 11a7.97 7.97 0 000 2l-2 1.5 2 3.4 2.4-.7a8 8 0 001.7 1l.5 2.8h4l.5-2.8a8 8 0 001.7-1l2.4.7 2-3.4-2-1.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <main id="mainContent">
      <div id="onboarding" class="card onboarding hidden">
        <h2>두 사람의 이름을 알려주세요</h2>
        <p class="muted">이 링크는 두 사람이 함께 사용해요. 이름을 입력하면 각자의 책장이 만들어집니다.</p>
        <div class="field">
          <label>첫 번째 사람</label>
          <input id="onbName0" type="text" placeholder="이름" />
        </div>
        <div class="field">
          <label>두 번째 사람</label>
          <input id="onbName1" type="text" placeholder="이름" />
        </div>
        <button id="onbStart" class="btn-primary btn-block">시작하기</button>
      </div>

      <div id="mainView" class="hidden">
        <div class="tabs" id="readerTabs"></div>

        <section class="card goal-card">
          <div class="goal-top">
            <div class="goal-title">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/></svg>
              <span id="goalYearLabel"></span>
            </div>
            <button id="goalEditBtn" class="link-btn">목표 설정하기</button>
          </div>
          <div id="goalEditRow" class="goal-edit-row hidden">
            <input id="goalInput" type="number" min="0" placeholder="예: 24" />
            <button id="goalSaveBtn" class="btn-primary btn-sm">저장</button>
          </div>
          <div id="goalDisplay" class="hidden">
            <div class="goal-count"><b id="goalCountNum">0</b>권 / <span id="goalTargetNum">0</span>권 목표 (<span id="goalPct">0</span>%)</div>
            <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          </div>
          <p id="goalEmpty" class="muted small hidden">아직 목표가 없어요. 이번 해 목표 권수를 정해보세요.</p>
        </section>

        <div class="shelf-header">
          <h2 id="shelfTitle"></h2>
          <button id="addBookBtn" class="btn-primary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
            책 기록하기
          </button>
        </div>

        <div id="bookList" class="book-list"></div>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">책 기록하기</h2>
        <button id="modalClose" class="icon-btn" aria-label="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase (Realtime Database) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="script.js"></script>
</body>
</html>
